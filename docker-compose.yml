version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/library_db
    depends_on:
      db:
        condition: service_healthy
      
  prism-mock:
    image: stoplight/prism:5.14.3
    container_name: prism-mock-api

    command: mock -h 0.0.0.0 -p 4010 /api/openapi.yaml
    ports:
      - "4010:4010"
    volumes:

      - ./openapi.yaml:/api/openapi.yaml:ro

volumes:
  postgres_data: